[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rag-judge-research"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["torch==2.10.0", "transformers==4.57.3", "numpy==2.5.4", "scikit-learn==1.9.1", "scipy==1.18.1", "pandas==2.3.3", "pyarrow==23.0.0", "psutil==7.2.2", "nbformat==5.11.1", "nbclient==0.11.0", "ipykernel==7.4.0", "matplotlib==3.11.2", "pytest==9.2.0", "sentencepiece==0.2.1", "protobuf==7.36.2", "joblib==1.6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: runs actual local model inference"]
