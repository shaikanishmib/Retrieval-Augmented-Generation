[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-security-research"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy", "torch==2.10.0", "transformers==4.57.3", "scikit-learn", "scipy", "sentencepiece", "pandas", "matplotlib", "nbformat", "nbclient", "ipykernel", "psutil"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
