[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "agentic-rag-research"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["torch==2.10.0", "transformers==4.57.3", "sentence-transformers==5.2.0", "numpy", "psutil", "nbformat", "nbclient", "ipykernel", "matplotlib", "pandas", "pytest", "pyarrow"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
